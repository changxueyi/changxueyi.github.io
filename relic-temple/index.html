<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120d0a">
<title>锈色回廊 · RUST CORRIDOR</title>
<style>:root{
  --ink:#0c0a08; --ink2:#15110d; --bone:#ece4d6; --dim:rgba(236,228,214,.62); --faint:rgba(236,228,214,.2);
  --rust:#c66a33; --amber:#ffb24a; --teal:#4fd6c0; --hot:#ff5a40; --steel:#8d9aa3; --line:rgba(236,228,214,.16);
  --f:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:var(--bone);overflow:hidden;font-family:var(--f);-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;overflow:hidden;background:#000;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}
#ui .clickable,#ui button{pointer-events:auto}
/* boot */
#boot{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(120% 120% at 50% 10%,#241509 0%,#0c0a08 60%);transition:opacity .6s ease;padding:0 24px}
#boot.done{opacity:0;pointer-events:none}
.boot-logo{font-weight:900;font-size:clamp(40px,9vw,92px);letter-spacing:.22em;margin-right:-.22em;
  background:linear-gradient(180deg,#ffd9a0,#c66a33);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(198,106,51,.3)}
.boot-sub{font:12px/1.5 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.boot-bar{width:min(340px,72vw);height:2px;background:#2a2017;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rust),var(--amber));transition:width .25s ease}
.boot-tag{font:11px/1.6 var(--mono);letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
#fatal{position:absolute;left:12px;right:12px;bottom:12px;z-index:60;font:12px/1.5 var(--mono);color:#ffb0a0;background:rgba(0,0,0,.7);padding:8px 10px;border:1px solid #512;display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-logo">锈色回廊</div>
    <div class="boot-sub" id="boot-msg">正在载入</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-tag">RUST CORRIDOR · THREE.JS 原创动作演示</div>
  </div>
</div>

#ui{font-family:var(--f);color:var(--bone)}
#ui b{font-weight:800}
/* ---- fullscreen menu ---- */
.scr{position:absolute;inset:0;display:none;pointer-events:auto;z-index:30;
  flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));
  background:radial-gradient(130% 115% at 50% 0%,rgba(40,23,10,.60),rgba(9,7,5,.90) 64%)}
.scr.on{display:flex;animation:fade .45s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{position:relative;width:min(560px,92vw);padding:34px 36px 28px;text-align:center;
  background:linear-gradient(180deg,rgba(28,20,14,.94),rgba(13,10,8,.96));
  border:1px solid var(--line);border-radius:5px;
  box-shadow:0 0 0 1px rgba(255,178,74,.08) inset,0 26px 64px rgba(0,0,0,.6),0 0 70px rgba(198,106,51,.12)}
.panel::before,.panel::after{content:'';position:absolute;width:18px;height:18px;border:1px solid var(--amber);opacity:.55}
.panel::before{left:11px;top:11px;border-right:0;border-bottom:0}
.panel::after{right:11px;bottom:11px;border-left:0;border-top:0}
.kick{font:600 12px/1 var(--mono);letter-spacing:.44em;text-transform:uppercase;color:var(--amber);opacity:.88;margin-right:-.44em}
.title{margin:16px 0 4px;font-weight:900;font-size:clamp(34px,7vw,60px);letter-spacing:.16em;margin-right:-.16em;
  background:linear-gradient(180deg,#ffe7c0,#ffb24a 55%,#c66a33);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 38px rgba(198,106,51,.3)}
.title.dead{background:linear-gradient(180deg,#ffd2c6,#ff5a40);-webkit-background-clip:text;background-clip:text;color:transparent}
.title.win{background:linear-gradient(180deg,#eafff6,#4fd6c0 58%,#ffb24a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font:500 13px/1 var(--f);letter-spacing:.34em;color:var(--dim);margin-right:-.34em}
.blurb{margin:18px auto 4px;max-width:40ch;font-size:14px;line-height:2;color:var(--dim);letter-spacing:.02em}
.blurb em{color:var(--teal);font-style:normal}
.blurb .v{color:var(--amber)}
.seal{position:absolute;right:24px;top:24px;width:50px;height:50px;border:2px solid var(--hot);border-radius:7px;
  display:flex;align-items:center;justify-content:center;color:var(--hot);font-weight:900;font-size:15px;
  transform:rotate(7deg);opacity:.92;box-shadow:0 0 18px rgba(255,90,64,.32);text-shadow:0 0 8px rgba(255,90,64,.5);padding:4px}
.seal span{writing-mode:vertical-rl;letter-spacing:.06em}
/* ---- buttons / hints ---- */
.btn{pointer-events:auto;cursor:pointer;border:0;font-family:var(--f);font-weight:800;letter-spacing:.2em;margin-right:-.2em;

.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,178,74,.5),0 0 0 1px rgba(255,220,160,.7) inset;filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--amber);box-shadow:0 0 0 1px var(--line) inset}
.btn.ghost:hover{box-shadow:0 0 0 1px var(--amber) inset;color:#ffd9a0;filter:none}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.keys{display:flex;flex-wrap:wrap;gap:9px 11px;justify-content:center;margin:22px auto 2px;max-width:470px}
.key{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);letter-spacing:.04em}
.cap{min-width:24px;height:24px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;
  font:700 11px/1 var(--mono);color:var(--bone);background:rgba(236,228,214,.07);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px}
.best{margin-top:20px;font:600 12px/1 var(--mono);letter-spacing:.16em;color:var(--steel);text-transform:uppercase}
.best b{color:var(--amber)}
.stats{display:flex;gap:28px;justify-content:center;margin:24px 0 2px}
.stat{min-width:74px}
.stat .v{font-weight:900;font-size:32px;line-height:1;color:var(--amber);text-shadow:0 0 18px rgba(255,178,74,.26)}
.stat .l{margin-top:8px;font:600 11px/1 var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
/* ---- HUD ---- */
.hud{position:absolute;inset:0;display:none;z-index:25}
.hud.on{display:block}
.hud-tl{position:absolute;left:calc(20px + var(--sal));top:calc(18px + var(--sat));width:min(300px,52vw)}
.srow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.ico{flex:0 0 auto;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;border:1px solid var(--line);background:rgba(9,7,5,.55)}
.ico.hp{color:var(--hot);border-color:rgba(255,90,64,.42)}
.ico.ut{color:var(--teal);border-color:rgba(79,214,192,.42)}
.bar{position:relative;flex:1;height:14px;background:rgba(9,7,5,.62);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left center;border-radius:8px;transition:transform .12s linear}
.bar.hp i{background:linear-gradient(90deg,#ff7a4a,#ff5a40);box-shadow:0 0 14px rgba(255,90,64,.5)}
.bar.ut i{background:linear-gradient(90deg,#4fd6c0,#9bece0);box-shadow:0 0 14px rgba(79,214,192,.5)}
.bar .tx{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:700 10px/1 var(--mono);color:var(--bone);text-shadow:0 1px 2px #000;letter-spacing:.04em}
.bar.low i{animation:lowp .6s infinite}
@keyframes lowp{50%{filter:brightness(1.45)}}
.bar.full.ut i{animation:utr 1s infinite}
@keyframes utr{50%{filter:brightness(1.5) saturate(1.3)}}
.hud-tr{position:absolute;right:calc(20px + var(--sar));top:calc(18px + var(--sat));text-align:right}
.score-l{font:600 10px/1 var(--mono);letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin:0 0 5px;margin-right:-.3em}
.score{font-weight:900;font-size:clamp(26px,4vw,40px);line-height:.95;letter-spacing:.02em;
  background:linear-gradient(180deg,#ffe7c0,#ffb24a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 24px rgba(255,178,74,.26)}
.meta{margin-top:9px;display:flex;gap:16px;justify-content:flex-end;font:600 12px/1 var(--mono);color:var(--steel);letter-spacing:.06em}
.meta b{color:var(--bone)}

/* ---- skill bar ---- */

.sk{position:relative;width:58px;height:58px;border-radius:9px;border:1px solid var(--line);

.sk .kbadge{position:absolute;left:7px;top:5px;z-index:3;font:800 10px/1 var(--mono);color:var(--amber);letter-spacing:.02em;text-shadow:0 1px 2px #000}
.sk .nm{position:relative;z-index:2;font-size:11px;color:var(--bone);letter-spacing:.05em;text-shadow:0 1px 2px #000}

.sk.ready{border-color:var(--teal);box-shadow:0 0 18px rgba(79,214,192,.55);animation:skr 1.1s infinite}

/* reticle */
.reticle{position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;

/* combo */
.combo{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0}
.combo.on{animation:combopop .34s cubic-bezier(.2,1.4,.4,1)}
.combo .n{font-weight:900;font-size:clamp(34px,6vw,58px);line-height:1;

.combo .l{font:700 11px/1 var(--mono);letter-spacing:.42em;color:var(--amber);margin-top:5px;margin-right:-.42em}
@keyframes combopop{0%{transform:translateX(-50%) scale(.5)}60%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
/* wave banner */
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;opacity:0}
.banner.on{animation:bin 2.4s ease forwards}
.banner .bt{font-weight:900;font-size:clamp(30px,6vw,56px);letter-spacing:.12em;margin-right:-.12em;color:var(--bone);text-shadow:0 0 30px rgba(198,106,51,.55)}
.banner .bs{margin-top:9px;font:600 13px/1 var(--mono);letter-spacing:.36em;color:var(--amber);margin-right:-.36em}

.banner.on .ln{animation:bln 2.4s ease forwards}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);pointer-events:none;white-space:nowrap;

.vig.low{opacity:1;box-shadow:inset 0 0 150px 42px rgba(255,40,30,.3);animation:lowv 1.4s infinite}
@keyframes lowv{50%{box-shadow:inset 0 0 186px 58px rgba(255,40,30,.46)}}
/* ---- touch controls ---- */
.hud.touch .skills,.hud.touch .reticle{display:none}
.touch-stick{position:absolute;left:calc(26px + var(--sal));bottom:calc(30px + var(--sab));width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(236,228,214,.07),rgba(9,7,5,.32));border:1px solid var(--line);pointer-events:auto;touch-action:none;z-index:28}
.touch-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;

.pad{position:absolute;right:calc(20px + var(--sar));bottom:calc(26px + var(--sab));z-index:28;

.touch-btn{pointer-events:auto;touch-action:none;width:62px;height:62px;border-radius:50%;border:1px solid var(--line);
  background:rgba(9,7,5,.55);color:var(--bone);font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;

.touch-btn .k{font:700 8px/1 var(--mono);opacity:.65;margin-top:3px}
